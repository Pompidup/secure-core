[package]
name = "secure-core"
version = "0.6.0"
edition = "2021"
description = "Core cryptographic primitives and secure building blocks"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
aes-gcm = { version = "0.10", features = ["zeroize"] }
# Not used directly: listed only to enable their `zeroize` features, so the
# AES-256 key schedule (which starts with the raw DEK) and the GHASH key held
# inside every `Aes256Gcm` are wiped on drop. Versions match aes-gcm 0.10.
aes = { version = "0.8", features = ["zeroize"] }
ghash = { version = "0.5", features = ["zeroize"] }
polyval = { version = "0.6", features = ["zeroize"] }
argon2 = "0.5"
base64 = "0.22"
jni = { version = "0.21", optional = true }
libc = "0.2"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
sha2 = "0.10"
tempfile = "3"

[[bench]]
name = "crypto_bench"
harness = false

[features]
_test-vectors = []
jni = ["dep:jni"]
log = ["dep:log"]

[dependencies.log]
version = "0.4"
optional = true
